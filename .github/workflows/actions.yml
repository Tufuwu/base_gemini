name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv: [
           py38-django32, py38-django40, py38-django41, py38-django42
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Note: GitHub Actions supports legacy versions, but some (like 3.4/3.5) 
          # may require specific runners or setup-python versions.
          python-version: |
            3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run tox
        run: tox -e ${{ matrix.toxenv }}
        env:
          TOXENV: ${{ matrix.toxenv }}

