name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8"]
        django-version: [3.2.23]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install . --use-mirrors || pip install .
        pip install django==${{ matrix.django-version }}
        pip install psycopg2
        python setup.py -q install

    - name: Setup Database
      run: |
        psql -h localhost -c 'create database test;' -U postgres
        psql -h localhost -d test -c 'create extension cube;' -U postgres
        psql -h localhost -d test -c 'create extension earthdistance;' -U postgres
      env:
        PGUSER: postgres

    - name: Run tests
      run: python runtests.py
      env:
        DJANGO_VERSION: ${{ matrix.django-version }}
        PGHOST: localhost
        PGUSER: postgres

