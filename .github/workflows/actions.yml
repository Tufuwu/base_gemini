name: CI

on:
  push:
    branches:
      - main
      - 'releases/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Before install
        run: |
          export TZ=Asia/Seoul
          python --version
          pip install -U pip
          pip install codecov

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests
        run: coverage run --omit="*/test*" -m unittest discover ./tests/ *test.py

      - name: Submit coverage
        if: success()
        run: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

