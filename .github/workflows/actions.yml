name: CI

on:
  push:
    branches: [ main, main ]
  pull_request:
    branches: [ main, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            django: "2.2"
          - python: "3.8"
            django: "3.0"
          - python: "3.8"
            django: "3.1"
          - python: "3.8"
            django: "3.2"
          - python: "3.8"
            django: "4.0"

    env:
      DJANGO: ${{ matrix.django }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Before Install
        run: |
          if [[ "${{ matrix.python }}" == "3.7" ]]; then pip install -U importlib_metadata; fi

      - name: Install dependencies
        run: |
          pip install tox tox-venv tox-gh-actions

      - name: Run tox
        run: tox
        continue-on-error: ${{ matrix.django == 'master' }}

